name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: muxreceipt-scenarios
      - uses: actions/checkout@v4
        with:
          repository: meridian-evidence-lab/muxreceipt-core
          ref: main
          path: muxreceipt-core
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: muxreceipt-scenarios
      - run: npm run demo
        working-directory: muxreceipt-scenarios
